<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="72%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#15151d"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d488"/>
      <stop offset="100%" stop-color="#b07f2a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint ward rings behind the mark -->
  <circle cx="900" cy="315" r="230" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.18"/>
  <circle cx="900" cy="315" r="270" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.1"/>

  <!-- diamond-slit mark, right side -->
  <g transform="translate(900,315)">
    <polygon points="0,-140 140,0 0,140 -140,0" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -84 0 C -46 -26, 46 -26, 84 0 C 46 26, -46 26, -84 0 Z"
          fill="#07070a" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="9" fill="url(#gold)"/>
    <line x1="0" y1="-140" x2="0" y2="-104" stroke="url(#gold)" stroke-width="2.5"/>
    <line x1="0" y1="104" x2="0" y2="140" stroke="url(#gold)" stroke-width="2.5"/>
  </g>

  <!-- wordmark and tagline, left side -->
  <text x="90" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#f5f1e6" letter-spacing="4">ORACLE</text>
  <line x1="92" y1="308" x2="420" y2="308" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>
  <text x="90" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#c9c2b2" font-style="italic">Sees your day before you live it.</text>
  <text x="90" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#c9c2b2" font-style="italic">Guards you through it.</text>
</svg>
